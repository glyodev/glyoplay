<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlyoPlay</title>
  <link rel="icon" href="public/logo.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #00000C;
      background: radial-gradient(ellipse at center, #0a0a14 0%, #00000C 70%);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .logo {
      max-width: 100px;
      height: auto;
      animation: fadeIn 1.2s ease-out;
    }

    .header-brand {
      position: absolute;
      top: 2rem;
      left: 2rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      animation: fadeIn 1.2s ease-out;
    }

    .brand-name {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #fff 0%, #a0a0b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .whatsapp-float {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 100;
    }

    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: #25D366;
      border-radius: 50%;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.4);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .whatsapp-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(37, 211, 102, 0.6);
    }

    .whatsapp-btn svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    .whatsapp-tooltip {
      position: absolute;
      bottom: 70px;
      right: 0;
      background: #1a1a2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem;
      width: 220px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.3s ease;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .whatsapp-tooltip.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .whatsapp-float:hover .whatsapp-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .whatsapp-tooltip::after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 20px;
      border-width: 8px 8px 0 8px;
      border-style: solid;
      border-color: #1a1a2e transparent transparent transparent;
    }

    .whatsapp-tooltip h4 {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #25D366;
    }

    .whatsapp-tooltip p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.4;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      animation: fadeIn 1.2s ease-out;
      width: 100%;
      max-width: 100%;
      padding: 0 1rem;
    }

    .icon-wrapper {
      position: relative;
      animation: float 3s ease-in-out infinite;
    }

    .icon-wrapper::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .tv-icon {
      width: 100px;
      height: 100px;
      position: relative;
      z-index: 1;
    }

    .gear {
      position: absolute;
      bottom: -5px;
      right: -10px;
      width: 40px;
      height: 40px;
      animation: rotate 8s linear infinite;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      margin-left: 0.5em;
      background: linear-gradient(135deg, #fff 0%, #a0a0b0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .btn-download {
      padding: 1rem 3rem;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn-download::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: -1;
    }

    .btn-download:hover {
      border-color: transparent;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
      transform: translateY(-2px);
    }

    .btn-download:hover::before {
      opacity: 1;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.5;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.2);
        opacity: 0.3;
      }
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 0.75rem;
      }

      h1 {
        font-size: 2rem;
        letter-spacing: 0.2em;
        text-align: center;
        margin-left: 0;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 0.75rem;
      }

      h1 {
        font-size: 1.5rem;
        letter-spacing: 0.2em;
        text-align: center;
        margin-left: 0;
      }

      .tv-icon {
        width: 60px;
        height: 60px;
      }

      .gear {
        width: 24px;
        height: 24px;
        bottom: -2px;
        right: -4px;
      }

      .icon-wrapper::before {
        width: 90px;
        height: 90px;
      }

      .container {
        gap: 1.25rem;
        width: 100%;
        max-width: 100%;
        padding: 0 0.5rem;
      }

      .btn-download {
        padding: 0.75rem 1.5rem;
        font-size: 0.75rem;
        width: 100%;
        max-width: 200px;
      }

      .logo {
        max-width: 40px;
      }

      .header-brand {
        top: 0.75rem;
        left: 0.75rem;
        gap: 0.4rem;
      }

      .brand-name {
        font-size: 1rem;
      }

      .whatsapp-float {
        bottom: 1rem;
        right: 1rem;
      }

      .whatsapp-btn {
        width: 48px;
        height: 48px;
      }

      .whatsapp-btn svg {
        width: 22px;
        height: 22px;
      }

      .whatsapp-tooltip {
        width: 160px;
        bottom: 58px;
        right: 0;
        padding: 0.75rem;
      }

      .whatsapp-tooltip h4 {
        font-size: 0.8rem;
      }

      .whatsapp-tooltip p {
        font-size: 0.7rem;
      }
    }

    @media (max-width: 320px) {
      h1 {
        font-size: 1rem;
        letter-spacing: 0.15em;
      }

      .tv-icon {
        width: 50px;
        height: 50px;
      }

      .gear {
        width: 20px;
        height: 20px;
      }

      .icon-wrapper::before {
        width: 75px;
        height: 75px;
      }

      .btn-download {
        padding: 0.625rem 1.25rem;
        font-size: 0.7rem;
      }

      .logo {
        max-width: 35px;
      }

      .brand-name {
        font-size: 0.9rem;
      }

      .whatsapp-tooltip {
        width: 140px;
        bottom: 55px;
      }
    }

    @media (max-width: 260px) {
      body {
        padding: 0.5rem;
      }

      h1 {
        font-size: 0.9rem;
        letter-spacing: 0.1em;
      }

      .tv-icon {
        width: 45px;
        height: 45px;
      }

      .gear {
        width: 18px;
        height: 18px;
        bottom: -1px;
        right: -2px;
      }

      .icon-wrapper::before {
        width: 65px;
        height: 65px;
      }

      .container {
        gap: 1rem;
      }

      .btn-download {
        padding: 0.5rem 1rem;
        font-size: 0.65rem;
        max-width: 160px;
      }

      .logo {
        max-width: 30px;
      }

      .header-brand {
        top: 0.5rem;
        left: 0.5rem;
        gap: 0.3rem;
      }

      .brand-name {
        font-size: 0.8rem;
      }

      .whatsapp-float {
        bottom: 0.75rem;
        right: 0.75rem;
      }

      .whatsapp-btn {
        width: 42px;
        height: 42px;
      }

      .whatsapp-btn svg {
        width: 20px;
        height: 20px;
      }

      .whatsapp-tooltip {
        width: 130px;
        bottom: 50px;
        padding: 0.5rem;
      }

      .whatsapp-tooltip h4 {
        font-size: 0.75rem;
      }

      .whatsapp-tooltip p {
        font-size: 0.65rem;
      }
    }
  </style>
</head>

<body>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const tooltip = document.querySelector('.whatsapp-tooltip');

      setTimeout(() => {
        tooltip.classList.add('show');
      }, 500);

      setTimeout(() => {
        tooltip.classList.remove('show');
      }, 10500);
    });
  </script>
</body>

</html>
